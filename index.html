<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Porcelanatos 3D</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #121212; color: #ffffff; padding: 20px; }
    
    /* Layout principal: Catálogo (300px) | Simulador Grande (1fr) | Calculadora (300px) */
    .app-container {
      display: grid;
      grid-template-columns: 300px 1fr 300px;
      gap: 20px;
      max-width: 1600px;
      margin: 0 auto;
      align-items: start;
    }

    .panel {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 20px;
      border: 1px solid #2a2a2a;
    }

    h2 { color: #00adb5; margin-bottom: 15px; font-weight: 600; font-size: 1.2rem; }
    h3 { color: #eeeeee; margin-bottom: 10px; font-weight: 500; font-size: 0.95rem; border-bottom: 1px solid #333; padding-bottom: 5px; }

    /* Simulador 3D Gran Tamaño (Centro) */
    .preview-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 600px;
    }
    .viewport-3d {
      width: 100%;
      height: 550px;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
      border: 1px solid #333;
    }

    /* Catálogo (Izquierda) */
    .catalog-section { display: flex; flex-direction: column; gap: 15px; }
    .controls-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      background: #282828;
      padding: 8px;
      border-radius: 8px;
    }
    .btn-light {
      background: #333;
      border: 1px solid #444;
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      flex: 1;
    }
    .btn-light.active { background: #00adb5; border-color: #00adb5; font-weight: bold; }
    
    .grid-porcelanatos {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 15px;
    }

    .tile-card {
      width: 100%;
      height: 80px;
      object-fit: cover;
      border-radius: 6px;
      border: 2px solid #333;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }

    .tile-card:hover { transform: scale(1.05); border-color: #00adb5; }

    /* Calculadora (Derecha) */
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 0.8rem; color: #ccc; margin-bottom: 3px; }
    .form-group input {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #2b2b2b;
      color: #fff;
    }

    .btn-calc {
      width: 100%;
      background: #00c853;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-calc:hover { background: #00e676; }
  </style>
</head>
<body>

  <div class="app-container">

    <!-- LADO IZQUIERDO: CATÁLOGO E ILUMINACIÓN -->
    <section class="panel catalog-section">
      <h2>Catálogo</h2>
      
      <!-- Control de Iluminación -->
      <div class="controls-bar">
        <span style="font-size: 0.85rem; color: #aaa;">Luz:</span>
        <button class="btn-light active" onclick="cambiarLuz('dia')">☀️ Día</button>
        <button class="btn-light" onclick="cambiarLuz('noche')">🌙 Noche</button>
      </div>

      <div>
        <h3>Porcelanato Pared</h3>
       <h3>Porcelanato Pared</h3>
      <div class="galeria">
        <img src="piso-marmoleadoblanco-344.jpg" class="thumb" onclick="cambiarParedes('piso-marmoleadoblanco-344.jpg')" alt="Blanco">
        <img src="piso-marmoleadonegro-358.jpg" class="thumb" onclick="cambiarParedes('piso-marmoleadonegro-358.jpg')" alt="Negro">
        <img src="piso-griscemento-350.jpg" class="thumb" onclick="cambiarParedes('piso-griscemento-350.jpg')" alt="Gris Cemento">
        <img src="piso-marmoleadoazul-357.jpg" class="thumb" onclick="cambiarParedes('piso-marmoleadoazul-357.jpg')" alt="Azul">
        <img src="piso-marmoleadogris-347.jpg" class="thumb" onclick="cambiarParedes('piso-marmoleadogris-347.jpg')" alt="Gris Marmoleado">
        <img src="piso-superblanco-345.jpg" class="thumb" onclick="cambiarParedes('piso-superblanco-345.jpg')" alt="Súper Blanco">
        <img src="piso-supernegro-346.jpg" class="thumb" onclick="cambiarParedes('piso-supernegro-346.jpg')" alt="Súper Negro">
        <img src="pisobeige-343.jpg" class="thumb" onclick="cambiarParedes('pisobeige-343.jpg')" alt="Beige">
      </div>
    
        <h3>Porcelanato Piso</h3>
        <div class="grid-porcelanatos">
          <img class="tile-card" src="piso-marmoleadoblanco-144.jpg" onclick="cambiarPisos('piso-marmoleadoblanco-144.jpg')">
          <img class="tile-card" src="piso-marmoleadonegro-358.jpg" onclick="cambiarPisos('piso-marmoleadonegro-358.jpg')">
          <img class="tile-card" src="piso-marmoleadoazul-144.jpg" onclick="cambiarPisos('piso-marmoleadoazul-144.jpg')">
          <img class="tile-card" src="piso-blanco-144.jpg" onclick="cambiarPisos('piso-blanco-144.jpg')">
          <img class="tile-card" src="piso-negro-144.jpg" onclick="cambiarPisos('piso-negro-144.jpg')">
          <img class="tile-card" src="piso-gris-144.jpg" onclick="cambiarPisos('piso-gris-144.jpg')">
        </div>
      </div>
    </section>

    <!-- CENTRO: SIMULADOR 3D EN TAMAÑO GRANDE -->
    <section class="panel preview-section">
      <h2>Visualizador 3D</h2>
      <div id="canvas-container" class="viewport-3d">
        <!-- Aquí renderiza tu visualizador o imagen -->
      </div>
    </section>

    <!-- LADO DERECHO: CALCULADORA DE MATERIALES -->
    <section class="panel">
      <h2>Calcular Materiales</h2>
      
      <p style="color: #ff9800; font-size: 0.85rem; font-weight: bold; margin-bottom: 6px;">🧱 Paredes</p>
      <div class="form-group">
        <label>Alto de pared (m):</label>
        <input type="number" id="altoPared" step="0.01" placeholder="Ej: 2.80">
      </div>
      <div class="form-group">
        <label>Ancho de pared (m):</label>
        <input type="number" id="anchoPared" step="0.01" placeholder="Ej: 3.50">
      </div>
      <div class="form-group">
        <label>M² por caja (Pared):</label>
        <input type="number" id="m2CajaPared" step="0.01" value="1.44">
      </div>

      <p style="color: #ff9800; font-size: 0.85rem; font-weight: bold; margin-bottom: 6px; margin-top: 15px;">📐 Piso</p>
      <div class="form-group">
        <label>Largo de piso (m):</label>
        <input type="number" id="largoPiso" step="0.01" placeholder="Ej: 4.00">
      </div>
      <div class="form-group">
        <label>Ancho de piso (m):</label>
        <input type="number" id="anchoPiso" step="0.01" placeholder="Ej: 3.50">
      </div>
      <div class="form-group">
        <label>M² por caja (Piso):</label>
        <input type="number" id="m2CajaPiso" step="0.01" value="1.44">
      </div>

      <button class="btn-calc" onclick="calcularEstimado()">Calcular Estimado</button>
    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
