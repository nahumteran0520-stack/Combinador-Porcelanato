<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combinador de Porcelanato</title>
    
    <style>
        /* --- CONTENEDOR DEL VISUALIZADOR --- */
        .habitacion {
            position: relative;
            width: 100%;
            height: 380px;
            overflow: hidden;
            background-color: #111;
            border-radius: 8px;
        }

        /* Fondo base de la escena */
        .escena-base {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Área Interactiva de la Pared */
        #pared-interactiva {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60%;
            z-index: 2;
            background-repeat: repeat;
            background-size: 200px;
        }

        /* Área Interactiva del Piso */
        #piso-interactivo {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40%;
            z-index: 3;
            background-repeat: repeat;
            background-size: 150px;
        }

        /* Capa Superior de Muebles */
        .muebles-encima {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 4;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="habitacion">
        <div class="escena-base"></div>
        <div id="pared-interactiva"></div>
        <div id="piso-interactivo"></div>
    </div>

</body>
</html>
