<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Simulador de Porcelanatos 3D</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <!-- Habitación 3D -->
    <div class="habitacion">
      <div id="techo" class="techo"></div>
      <div id="pared-izq" class="pared-lateral izq"></div>
      <div id="pared-fondo" class="pared-fondo"></div>
      <div id="pared-der" class="pared-lateral der"></div>
      <div id="piso" class="piso"></div>
    </div>

    <!-- Catálogo Lateral -->
    <div class="sidebar">
      <h2>Catálogo</h2>
      <!-- CALCULADORA DE MATERIALES -->
<div class="calculadora-box">
  <h3>Calculadora de Materiales</h3>
  
  <div class="input-group">
    <label for="alto">Alto del espacio (m):</label>
    <input type="number" id="alto" placeholder="Ej: 2.80" step="0.01" min="0">
  </div>
  
  <div class="input-group">
    <label for="ancho">Ancho del espacio (m):</label>
    <input type="number" id="ancho" placeholder="Ej: 3.50" step="0.01" min="0">
  </div>

  <div class="input-group">
    <label for="rendimiento-caja">M² por caja:</label>
    <input type="number" id="rendimiento-caja" value="1.44" step="0.01" min="0.1">
  </div>

  <button type="button" class="btn-calcular" onclick="calcularMateriales()">Calcular Estimado</button>

  <div id="resultado-calculo" class="resultado-box" style="display: none;">
    <p><strong>Área total (+10% desp.):</strong> <span id="res-area">0</span> m²</p>
    <p><strong>Cajas de Porcelanato:</strong> <span id="res-cajas">0</span> cajas</p>
    <p><strong>Sacos de Pego (1.5m² c/u):</strong> <span id="res-pego">0</span> sacos</p>
  </div>
</div>
<!-- Control de Iluminación -->
<div class="control-iluminacion">
  <h3>Iluminación</h3>
  <div class="botones-luz">
    <button type="button" class="btn-luz activo" onclick="cambiarLuz('dia')">☀️ Día</button>
    <button type="button" class="btn-luz" onclick="cambiarLuz('noche')">🌙 Noche</button>
  </div>
</div>
      <h3>Porcelanato Pared</h3>
      <div class="galeria">
        <img src="piso-marmoleadoblanco-344.jpg" class="thumb" onclick="cambiarParedes('piso-marmoleadoblanco-344.jpg')" alt="Blanco">
        <img src="piso-marmoleadonegro-358.jpg" class="thumb" onclick="cambiarParedes('piso-marmoleadonegro-358.jpg')" alt="Negro">
        <img src="piso-griscemento-350.jpg" class="thumb" onclick="cambiarParedes('piso-griscemento-350.jpg')" alt="Gris Cemento">
        <img src="piso-marmoleadoazul-357.jpg" class="thumb" onclick="cambiarParedes('piso-marmoleadoazul-357.jpg')" alt="Azul">
        <img src="piso-marmoleadogris-347.jpg" class="thumb" onclick="cambiarParedes('piso-marmoleadogris-347.jpg')" alt="Gris Marmoleado">
        <img src="piso-superblanco-345.jpg" class="thumb" onclick="cambiarParedes('piso-superblanco-345.jpg')" alt="Súper Blanco">
        <img src="piso-supernegro-346.jpg" class="thumb" onclick="cambiarParedes('piso-supernegro-346.jpg')" alt="Súper Negro">
        <img src="pisobeige-343.jpg" class="thumb" onclick="cambiarParedes('pisobeige-343.jpg')" alt="Beige">
      </div>

      <h3>Porcelanato Piso</h3>
      <div class="galeria">
        <img src="piso-marmoleadoblanco-344.jpg" class="thumb" onclick="cambiarPiso('piso-marmoleadoblanco-344.jpg')" alt="Blanco">
        <img src="piso-marmoleadonegro-358.jpg" class="thumb" onclick="cambiarPiso('piso-marmoleadonegro-358.jpg')" alt="Negro">
        <img src="piso-griscemento-350.jpg" class="thumb" onclick="cambiarPiso('piso-griscemento-350.jpg')" alt="Gris Cemento">
        <img src="piso-marmoleadoazul-357.jpg" class="thumb" onclick="cambiarPiso('piso-marmoleadoazul-357.jpg')" alt="Azul">
        <img src="piso-marmoleadogris-347.jpg" class="thumb" onclick="cambiarPiso('piso-marmoleadogris-347.jpg')" alt="Gris Marmoleado">
        <img src="piso-superblanco-345.jpg" class="thumb" onclick="cambiarPiso('piso-superblanco-345.jpg')" alt="Súper Blanco">
        <img src="piso-supernegro-346.jpg" class="thumb" onclick="cambiarPiso('piso-supernegro-346.jpg')" alt="Súper Negro">
        <img src="pisobeige-343.jpg" class="thumb" onclick="cambiarPiso('pisobeige-343.jpg')" alt="Beige">
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
